apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observastack-gateway
  namespace: observastack
  labels:
    app.kubernetes.io/name: observastack-gateway
    app.kubernetes.io/part-of: observastack
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200-399"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/tags: Project=observastack,Environment=dev,ManagedBy=GitOps
spec:
  ingressClassName: alb
  rules:
    - host: dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: observastack-gateway
                port:
                  number: 8080
