apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-example
  namespace: observastack
spec:
  serviceName: storage-example
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-example
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-example
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["while true; do date >> /data/heartbeat.txt; sleep 30; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: observastack-ebs-gp3
        resources:
          requests:
            storage: 5Gi
