apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: observastack-general
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: REPLACE_WITH_KARPENTER_NODE_ROLE_NAME
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_WITH_EKS_CLUSTER_NAME
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_WITH_EKS_CLUSTER_NAME
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      rootVolume: true
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Project: observastack
    ManagedBy: Karpenter
