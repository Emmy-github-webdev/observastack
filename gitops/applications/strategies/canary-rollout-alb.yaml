apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: example-service
  namespace: observastack
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 6
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: example-service
  strategy:
    canary:
      stableService: example-service-stable
      canaryService: example-service-canary
      trafficRouting:
        alb:
          ingress: example-service
          rootService: example-service-root
          servicePort: 80
      abortScaleDownDelaySeconds: 60
      steps:
        - setWeight: 5
        - pause: {}
        - analysis:
            templates:
              - templateName: example-service-success-rate
        - setWeight: 25
        - pause:
            duration: 10m
        - setWeight: 50
        - pause:
            duration: 15m
        - setWeight: 75
        - pause:
            duration: 15m
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-service
    spec:
      containers:
        - name: example-service
          image: 579871530627.dkr.ecr.us-east-1.amazonaws.com/observastack:REPLACE_WITH_IMMUTABLE_DIGEST
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 3
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: example-service-root
  namespace: observastack
spec:
  selector:
    app.kubernetes.io/name: example-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: example-service-stable
  namespace: observastack
spec:
  selector:
    app.kubernetes.io/name: example-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: example-service-canary
  namespace: observastack
spec:
  selector:
    app.kubernetes.io/name: example-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-service
  namespace: observastack
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: example-service-root
                port:
                  name: use-annotation
