apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-service-dev
  namespace: argocd
spec:
  project: observastack-applications
  source:
    repoURL: https://github.com/Emmy-github-webdev/observastack.git
    targetRevision: main
    path: gitops/environments/dev/user-service
  destination:
    server: https://kubernetes.default.svc
    namespace: observastack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
