apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observastack-applications
  namespace: argocd
spec:
  description: ObservaStack non-production application workloads
  sourceRepos:
    - https://github.com/Emmy-github-webdev/observastack.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: observastack
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
    - group: argoproj.io
      kind: AnalysisRun
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy