name: GitOps Validation

on:
  pull_request:
    paths:
      - "gitops/**"
      - "kubernetes/**"
      - ".github/workflows/gitops-validation.yml"
      - ".yamllint"
  push:
    branches:
      - main
    paths:
      - "gitops/**"
      - "kubernetes/**"
      - ".github/workflows/gitops-validation.yml"
      - ".yamllint"

permissions:
  contents: read

concurrency:
  group: gitops-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: "0.7.0"

jobs:
  yaml:
    name: YAML validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install yamllint
        run: python -m pip install --disable-pip-version-check yamllint

      - name: Validate YAML
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find gitops kubernetes \
              -type f \
              \( -name '*.yaml' -o -name '*.yml' \) \
              -print0
          )

          if (( ${#files[@]} == 0 )); then
            echo "No YAML files found."
            exit 0
          fi

          yamllint "${files[@]}"

  kubernetes:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp

          sudo install -m 0755 \
            /tmp/kubeconform \
            /usr/local/bin/kubeconform

          kubeconform -v

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find kubernetes gitops \
              -type f \
              \( -name '*.yaml' -o -name '*.yml' \) \
              -print0
          )

          if (( ${#files[@]} == 0 )); then
            echo "No Kubernetes YAML files found."
            exit 0
          fi

          kubeconform \
            -strict \
            -ignore-missing-schemas \
            "${files[@]}"
