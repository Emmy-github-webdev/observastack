name: Terraform Backend Bootstrap

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

      environment:
        description: Environment whose backend is being managed
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev

      confirm_destroy:
        description: Type DESTROY to authorize backend destruction
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-backend-bootstrap-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLI_ARGS: "-no-color"

  TERRAFORM_VERSION: "1.14.6"
  TF_ROOT: terraform/global/backend

jobs:

  # ============================================================
  # Validate workflow configuration
  # ============================================================

  validate:
    name: Validate bootstrap configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${AWS_REGION:?Repository variable AWS_REGION is required}"

          if [[ ! -d "${TF_ROOT}" ]]; then
            echo "::error::Terraform root does not exist: ${TF_ROOT}"
            exit 1
          fi

          for file in \
            "${TF_ROOT}/main.tf" \
            "${TF_ROOT}/versions.tf"
          do
            if [[ ! -f "${file}" ]]; then
              echo "::error::Required Terraform file is missing: ${file}"
              exit 1
            fi
          done

          case "${{ inputs.operation }}" in
            plan|apply)
              ;;

            destroy)
              if [[ "${{ inputs.confirm_destroy }}" != "DESTROY" ]]; then
                echo "::error::Destroy requires confirm_destroy=DESTROY."
                exit 1
              fi

              echo "::warning::Terraform backend destruction explicitly authorized."

              if [[ "${{ inputs.environment }}" == "production" ]]; then
                echo "::warning::PRODUCTION BACKEND DESTRUCTION REQUESTED."
              fi
              ;;

            *)
              echo "::error::Invalid operation."
              exit 1
              ;;
          esac

      - name: Write configuration summary
        shell: bash
        run: |
          {
            echo "### Terraform Backend Bootstrap"
            echo
            echo "- Operation: \`${{ inputs.operation }}\`"
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Terraform: \`${TERRAFORM_VERSION}\`"
            echo "- Root: \`${TF_ROOT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"


  # ============================================================
  # Generate immutable plan
  # ============================================================

  plan:
    name: Terraform ${{ inputs.operation }}
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.TERRAFORM_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-backend-plan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Terraform version
        run: terraform version

      - name: Terraform format check
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive -no-color

      # Bootstrap module must NOT initialize the backend it creates.
      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init \
            -backend=false \
            -input=false \
            -no-color

      - name: Terraform validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [[ "${{ inputs.operation }}" == "destroy" ]]; then
            echo "::warning::Generating Terraform DESTROY plan."
            echo "::warning::Environment: ${{ inputs.environment }}"

            terraform plan \
              -destroy \
              -out=tfplan \
              -input=false \
              -no-color
          else
            terraform plan \
              -out=tfplan \
              -input=false \
              -no-color
          fi

      - name: Show Terraform plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform show \
            -no-color \
            tfplan

      - name: Generate plan summary
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform show \
            -no-color \
            tfplan \
            > "${GITHUB_WORKSPACE}/terraform-backend-plan.txt"

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v6
        with:
          name: terraform-backend-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          if-no-files-found: error
          retention-days: 7

      - name: Upload Terraform plan summary
        uses: actions/upload-artifact@v6
        with:
          name: terraform-backend-plan-summary-${{ inputs.environment }}-${{ github.run_id }}
          path: terraform-backend-plan.txt
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # Apply
  # ============================================================

  apply:
    name: Apply backend
    needs:
      - validate
      - plan

    if: inputs.operation == 'apply'

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.TERRAFORM_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-backend-apply-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init \
            -backend=false \
            -input=false \
            -no-color

      - name: Download approved Terraform plan
        uses: actions/download-artifact@v6
        with:
          name: terraform-backend-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}

      - name: Verify plan
        working-directory: ${{ env.TF_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          test -f tfplan

          echo "Applying approved Terraform plan:"
          terraform show -no-color tfplan

      - name: Apply Terraform plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform apply \
            -input=false \
            -no-color \
            tfplan

      - name: Write summary
        run: |
          {
            echo "### Terraform Backend Applied"
            echo
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: \`${GITHUB_RUN_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"


  # ============================================================
  # Destroy
  # ============================================================

  destroy:
    name: Destroy backend
    needs:
      - validate
      - plan

    if: inputs.operation == 'destroy'

    runs-on: ubuntu-latest

    # IMPORTANT:
    # Configure this GitHub Environment with required reviewers.
    #
    # For production, require manual approval here.
    environment:
      name: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.TERRAFORM_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-backend-destroy-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init \
            -backend=false \
            -input=false \
            -no-color

      - name: Download approved destroy plan
        uses: actions/download-artifact@v6
        with:
          name: terraform-backend-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}

      - name: Verify destroy authorization
        working-directory: ${{ env.TF_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          test "${{ inputs.confirm_destroy }}" = "DESTROY"
          test -f tfplan

          echo "::warning::DESTROY PLAN APPROVED."
          echo "::warning::Environment: ${{ inputs.environment }}"

          terraform show -no-color tfplan

      - name: Destroy Terraform backend
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform apply \
            -input=false \
            -no-color \
            tfplan

      - name: Write summary
        run: |
          {
            echo "### Terraform Backend Destroyed"
            echo
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: \`${GITHUB_RUN_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
