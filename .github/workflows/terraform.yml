name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan/apply"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  detect:
    name: Detect Terraform changes
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.paths.outputs.dev }}
      staging: ${{ steps.paths.outputs.staging }}
      production: ${{ steps.paths.outputs.production }}
    steps:
      - uses: actions/checkout@v6.0.2

      - id: paths
        name: Determine affected environments
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.environment }}" in
              dev) echo "dev=true" >> "$GITHUB_OUTPUT" ;;
              staging) echo "staging=true" >> "$GITHUB_OUTPUT" ;;
              production) echo "production=true" >> "$GITHUB_OUTPUT" ;;
            esac
            exit 0
          fi

          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -q '^terraform/'; then
            echo "dev=true" >> "$GITHUB_OUTPUT"
            echo "staging=true" >> "$GITHUB_OUTPUT"
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev=false" >> "$GITHUB_OUTPUT"
            echo "staging=false" >> "$GITHUB_OUTPUT"
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Terraform validation
    needs: detect
    if: github.event_name == 'pull_request' || needs.detect.outputs.dev == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.6"

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform

      - name: Validate modules and environments
        shell: bash
        run: |
          set -euo pipefail

          find terraform -type f -name '*.tf' -print0 | while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            if [[ ! -d "$dir/.terraform" ]]; then
              terraform -chdir="$dir" init -backend=false -input=false -no-color
            fi
            terraform -chdir="$dir" validate -no-color
          done

  plan:
    name: Plan
    needs: [detect, validate]
    if: github.event_name == 'pull_request' || needs.detect.outputs.dev == 'true' || needs.detect.outputs.staging == 'true' || needs.detect.outputs.production == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            run: ${{ needs.detect.outputs.dev }}
          - environment: staging
            run: ${{ needs.detect.outputs.staging }}
          - environment: production
            run: ${{ needs.detect.outputs.production }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Skip unaffected environment
        if: matrix.run != 'true' && github.event_name != 'pull_request'
        run: echo "Environment not affected."

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        if: matrix.run == 'true' || github.event_name == 'pull_request'
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-plan-${{ matrix.environment }}-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - uses: hashicorp/setup-terraform@v4.0.1
        if: matrix.run == 'true' || github.event_name == 'pull_request'
        with:
          terraform_version: "1.14.6"

      - name: Terraform init
        if: matrix.run == 'true' || github.event_name == 'pull_request'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=observastack/${{ matrix.environment }}/terraform.tfstate" \
            -input=false \
            -no-color

      - name: Terraform plan
        if: matrix.run == 'true' || github.event_name == 'pull_request'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan
        if: matrix.run == 'true' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: terraform-plan-${{ matrix.environment }}-${{ github.sha }}
          path: terraform/environments/${{ matrix.environment }}/tfplan
          retention-days: 7

  apply:
    name: Apply
    needs: [detect, validate, plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.detect.outputs.dev == 'true' || needs.detect.outputs.staging == 'true' || needs.detect.outputs.production == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            run: ${{ needs.detect.outputs.dev }}
          - environment: staging
            run: ${{ needs.detect.outputs.staging }}
          - environment: production
            run: ${{ needs.detect.outputs.production }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6.0.2
        if: matrix.run == 'true'

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        if: matrix.run == 'true'
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply-${{ matrix.environment }}-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - uses: hashicorp/setup-terraform@v4.0.1
        if: matrix.run == 'true'
        with:
          terraform_version: "1.14.6"

      - name: Terraform init
        if: matrix.run == 'true'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=observastack/${{ matrix.environment }}/terraform.tfstate" \
            -input=false \
            -no-color

      - name: Download plan
        if: matrix.run == 'true'
        uses: actions/download-artifact@v6
        with:
          name: terraform-plan-${{ matrix.environment }}-${{ github.sha }}
          path: terraform/environments/${{ matrix.environment }}

      - name: Apply
        if: matrix.run == 'true'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform apply -input=false -no-color tfplan
