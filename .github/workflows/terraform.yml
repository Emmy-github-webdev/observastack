name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/terraform-bootstrap.yml"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/terraform-bootstrap.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev

      action:
        description: Terraform operation
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

      confirm_destroy:
        description: Type DESTROY to authorize a destroy operation
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.14.6"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}

jobs:

  # ============================================================
  # SELECT OPERATION
  # ============================================================

  select:
    name: Select Terraform operation
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.select.outputs.environment }}
      action: ${{ steps.select.outputs.action }}
      root: ${{ steps.select.outputs.root }}

    steps:
      - name: Select operation
        id: select
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in

            pull_request)
              environment="dev"
              action="plan"
              ;;

            push)
              environment="dev"
              action="apply"
              ;;

            workflow_dispatch)
              environment="${{ inputs.environment }}"
              action="${{ inputs.action }}"
              ;;

            *)
              echo "::error::Unsupported event: ${{ github.event_name }}"
              exit 1
              ;;

          esac

          case "${environment}" in
            dev|staging|production)
              ;;
            *)
              echo "::error::Invalid environment: ${environment}"
              exit 1
              ;;
          esac

          case "${action}" in
            plan|apply|destroy)
              ;;
            *)
              echo "::error::Invalid Terraform action: ${action}"
              exit 1
              ;;
          esac

          if [[ "${action}" == "destroy" ]]; then
            if [[ "${{ inputs.confirm_destroy }}" != "DESTROY" ]]; then
              echo "::error::Destroy requires confirm_destroy=DESTROY."
              exit 1
            fi

            echo "::warning::Terraform destroy explicitly authorized."
          fi

          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "action=${action}" >> "$GITHUB_OUTPUT"
          echo "root=terraform/environments/${environment}" >> "$GITHUB_OUTPUT"

          {
            echo "### Terraform Operation"
            echo
            echo "- Environment: \`${environment}\`"
            echo "- Action: \`${action}\`"
            echo "- Root: \`terraform/environments/${environment}\`"
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # VALIDATE
  # ============================================================

  validate:
    name: Terraform validation
    needs: select

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform version
        run: terraform version

      - name: Terraform format check
        run: |
          terraform fmt \
            -check \
            -recursive \
            terraform

      - name: Validate Terraform modules
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t dirs < <(
            find terraform \
              -type f \
              -name '*.tf' \
              -not -path 'terraform/environments/*' \
              -printf '%h\n' |
            sort -u
          )

          for dir in "${dirs[@]}"; do
            echo "=========================================="
            echo "Validating: ${dir}"
            echo "=========================================="

            terraform -chdir="${dir}" init \
              -backend=false \
              -input=false \
              -no-color

            terraform -chdir="${dir}" validate \
              -no-color
          done

      - name: Validate selected environment
        working-directory: ${{ needs.select.outputs.root }}
        run: |
          terraform init \
            -backend=false \
            -input=false \
            -no-color

          terraform validate \
            -no-color


  # ============================================================
  # TERRAFORM TESTS
  # ============================================================

  test:
    name: Terraform tests
    needs:
      - select
      - validate

    runs-on: ubuntu-latest

    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Run Terraform tests
        working-directory: terraform
        run: |
          if compgen -G "tests/**/*.tftest.hcl" > /dev/null; then
            terraform test ./tests/...
          else
            echo "No Terraform tests found."
          fi


  # ============================================================
  # PLAN
  # ============================================================

  plan:
    name: Terraform ${{ needs.select.outputs.action }}
    needs:
      - select
      - validate

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.select.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ needs.select.outputs.action == 'plan' && vars.TERRAFORM_PLAN_ROLE_ARN || vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-${{ needs.select.outputs.action }}-${{ needs.select.outputs.environment }}-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Terraform init
        working-directory: ${{ needs.select.outputs.root }}
        run: |
          terraform init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=observastack/${{ needs.select.outputs.environment }}/terraform.tfstate" \
            -input=false \
            -no-color

      - name: Terraform validate
        working-directory: ${{ needs.select.outputs.root }}
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: ${{ needs.select.outputs.root }}
        run: |
          set -euo pipefail

          case "${{ needs.select.outputs.action }}" in
            destroy)
              terraform plan \
                -destroy \
                -input=false \
                -no-color \
                -out=tfplan
              ;;

            *)
              terraform plan \
                -input=false \
                -no-color \
                -out=tfplan
              ;;
          esac

      - name: Show Terraform plan
        working-directory: ${{ needs.select.outputs.root }}
        run: |
          terraform show \
            -no-color \
            tfplan \
            > tfplan.txt

          cat tfplan.txt

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v6
        with:
          name: terraform-plan-${{ needs.select.outputs.environment }}-${{ github.run_id }}
          path: |
            ${{ needs.select.outputs.root }}/tfplan
            ${{ needs.select.outputs.root }}/tfplan.txt
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # APPLY
  # ============================================================

  apply:
    name: Terraform Apply
    needs:
      - select
      - validate
      - plan

    if: |
      needs.select.outputs.action == 'apply'

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.select.outputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply-${{ needs.select.outputs.environment }}-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        working-directory: ${{ needs.select.outputs.root }}
        run: |
          terraform init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=observastack/${{ needs.select.outputs.environment }}/terraform.tfstate" \
            -input=false \
            -no-color

      - name: Download Terraform plan
        uses: actions/download-artifact@v6
        with:
          name: terraform-plan-${{ needs.select.outputs.environment }}-${{ github.run_id }}
          path: ${{ needs.select.outputs.root }}

      - name: Verify Terraform plan
        working-directory: ${{ needs.select.outputs.root }}
        run: |
          set -euo pipefail
          test -f tfplan
          terraform show -no-color tfplan

      - name: Apply Terraform plan
        working-directory: ${{ needs.select.outputs.root }}
        run: |
          terraform apply \
            -input=false \
            -no-color \
            tfplan

      - name: Write summary
        run: |
          {
            echo "### Terraform Applied"
            echo
            echo "- Environment: \`${{ needs.select.outputs.environment }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: \`${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # DESTROY
  # ============================================================

  destroy:
    name: Terraform Destroy
    needs:
      - select
      - validate
      - plan

    if: |
      needs.select.outputs.action == 'destroy'

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.select.outputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-destroy-${{ needs.select.outputs.environment }}-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        working-directory: ${{ needs.select.outputs.root }}
        run: |
          terraform init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=observastack/${{ needs.select.outputs.environment }}/terraform.tfstate" \
            -input=false \
            -no-color

      - name: Download destroy plan
        uses: actions/download-artifact@v6
        with:
          name: terraform-plan-${{ needs.select.outputs.environment }}-${{ github.run_id }}
          path: ${{ needs.select.outputs.root }}

      - name: Verify destroy authorization
        working-directory: ${{ needs.select.outputs.root }}
        run: |
          set -euo pipefail

          if [[ "${{ inputs.confirm_destroy }}" != "DESTROY" ]]; then
            echo "::error::Destroy requires confirm_destroy=DESTROY."
            exit 1
          fi

          test -f tfplan

          echo "::warning::Terraform destroy is authorized."
          terraform show -no-color tfplan

      - name: Destroy Terraform resources
        working-directory: ${{ needs.select.outputs.root }}
        run: |
          terraform apply \
            -input=false \
            -no-color \
            tfplan

      - name: Write summary
        run: |
          {
            echo "### Terraform Destroy Completed"
            echo
            echo "- Environment: \`${{ needs.select.outputs.environment }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: \`${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
