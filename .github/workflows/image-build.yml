name: Image Build

on:
  push:
    branches:
      - main
    paths:
      - "services/**"
      - ".github/workflows/image-build.yml"

  workflow_dispatch:
    inputs:
      service:
        description: "Service to build"
        required: true
        type: choice
        options:
          - user-service
          - product-service
          - order-service
          - payment-service

permissions:
  contents: read
  id-token: write

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check whether service should build
        id: service
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.service }}" == "${{ matrix.service }}" ]]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Push event:
          # The workflow itself already guarantees that something
          # under services/** or this workflow changed.
          #
          # We still need to determine which matrix entries changed.
          if git diff --name-only \
              "${{ github.event.before }}" \
              "${{ github.sha }}" |
              grep -q "^services/${{ matrix.service }}/"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.service.outputs.build == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.DEV_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-image-build-${{ matrix.service }}-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        if: steps.service.outputs.build == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image
        if: steps.service.outputs.build == 'true'
        id: image
        shell: bash
        run: |
          set -euo pipefail

          repository="${ECR_REGISTRY}/${{ matrix.service }}"
          tag="${GITHUB_SHA}"

          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${repository}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.service.outputs.build == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          provenance: true
          sbom: true

      - name: Scan image
        if: steps.service.outputs.build == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Generate SBOM
        if: steps.service.outputs.build == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.json
          scanners: vuln

      - name: Upload SBOM
        if: steps.service.outputs.build == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.json
          retention-days: 30

      - name: Publish build summary
        if: steps.service.outputs.build == 'true'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
