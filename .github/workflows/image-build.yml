name: Image Build

on:
  push:
    branches:
      - main
    paths:
      - "services/**"
      - ".github/workflows/image-build.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build"
        required: true
        type: choice
        options:
          - user-service
          - product-service
          - order-service
          - payment-service

permissions:
  contents: read
  id-token: write
  packages: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  build:
    name: Build and publish ${{ inputs.service || 'changed services' }}
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - payment-service

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Select service
        id: select
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.service }}" != "${{ matrix.service }}" ]]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              echo "build=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q "^services/${{ matrix.service }}/"; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure AWS credentials
        if: steps.select.outputs.build == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.DEV_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: image-build-${{ matrix.service }}-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Login to ECR
        if: steps.select.outputs.build == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set image metadata
        if: steps.select.outputs.build == 'true'
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "repository=${{ vars.ECR_REGISTRY }}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        if: steps.select.outputs.build == 'true'
        env:
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.repository }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --file "services/${{ matrix.service }}/Dockerfile" \
            --tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            "services/${{ matrix.service }}"

      - name: Scan image
        if: steps.select.outputs.build == 'true'
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Generate SBOM
        if: steps.select.outputs.build == 'true'
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.json
          scanners: vuln

      - name: Push image
        if: steps.select.outputs.build == 'true'
        env:
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.repository }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Resolve image digest
        if: steps.select.outputs.build == 'true'
        id: digest
        env:
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.repository }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images \
            --repository-name "${{ matrix.service }}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_DIGEST=${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM
        if: steps.select.outputs.build == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.json
          retention-days: 30
